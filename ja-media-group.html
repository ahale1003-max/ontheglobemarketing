<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07070f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>On the Globe Marketing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,700;1,900&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    body { background: #07070f; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%; position: relative; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #07070f; }
    ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.4); border-radius: 3px; }
    @media (max-width: 768px) {
      .desktop-nav { display: none !important; }
      .mobile-menu-btn { display: flex !important; }
    }
    @media (max-width: 900px) {
      .footer-grid { grid-template-columns: 1fr 1fr !important; }
    }
    @media (max-width: 560px) {
      .footer-grid { grid-template-columns: 1fr !important; }
    }

    @keyframes logoScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .logo-track { animation: logoScroll 22s linear infinite; }
    .logo-track:hover { animation-play-state: paused; }

    /* ── THREE.JS HERO ───────────────────────────────────── */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 700px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #three-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .hero-vignette { position: absolute; inset: 0; z-index: 2; background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 30%, rgba(7,7,26,0.6) 100%); pointer-events: none; }
    .hero-fog-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 200px; z-index: 3; background: linear-gradient(to top, #07070f, transparent); pointer-events: none; }
    .hero-content-3d {
      position: relative; z-index: 10;
      text-align: center; max-width: 820px;
      padding: 0 clamp(1rem,5vw,3rem);
      pointer-events: none;
      margin-top: -2rem;
    }
    .hero-badge-3d {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      padding: 5px 14px 5px 8px;
      margin-bottom: 32px;
      pointer-events: all;
    }
    .hero-badge-tag-3d {
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border-radius: 100px; padding: 2px 10px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: white;
    }
    .hero-badge-text-3d { font-size: 13px; color: rgba(240,239,255,0.7); }
    .hero-title-3d {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(52px, 8vw, 96px);
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: white;
      margin-bottom: 20px;
    }
    .hero-title-3d em {
      font-style: italic;
      background: linear-gradient(90deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub-3d { font-size: 17px; line-height: 1.6; color: rgba(240,239,255,0.58); max-width: 480px; width: 100%; margin: 0 auto 36px; padding: 0 1rem; }
    .hero-ctas-3d { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; pointer-events: all; }
    .hero-btn-outline-3d {
      background: rgba(255,255,255,0.08); color: white;
      border: 1px solid rgba(255,255,255,0.2); border-radius: 100px;
      padding: 13px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; backdrop-filter: blur(6px);
      transition: background 0.2s, transform 0.15s;
    }
    .hero-btn-outline-3d:hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
    .hero-btn-filled-3d {
      background: white; color: #0a0a14;
      border: none; border-radius: 100px;
      padding: 13px 28px; font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(255,255,255,0.12);
    }
    .hero-btn-filled-3d:hover { background: #e8e8ff; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,255,255,0.25); }

    /* ── TICKER ──────────────────────────────────────────── */
    .ticker-wrap-3d {
      position: absolute; bottom: 0; left: 0; right: 0;
      z-index: 10;
      background: rgba(7,7,26,0.55);
      border-top: 1px solid rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      overflow: hidden; padding: 14px 0;
    }
    .ticker-label-3d { text-align: center; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 12px; font-weight: 600; }
    .ticker-track-3d { display: flex; animation: ticker3d 28s linear infinite; width: max-content; }
    .ticker-track-3d:hover { animation-play-state: paused; }
    @keyframes ticker3d { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .ticker-item-3d { display: flex; align-items: center; gap: 8px; padding: 0 28px; font-size: 13px; color: rgba(240,239,255,0.5); white-space: nowrap; }
    .ticker-dot-3d { width: 5px; height: 5px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); flex-shrink: 0; }

    /* ── TESTIMONIAL MODAL ───────────────────────────────── */
    .modal-backdrop { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal-box { background: #0f0f1f; border: 1px solid rgba(139,92,246,0.3); border-radius: 20px; padding: clamp(1.5rem,4vw,2.5rem); width: 100%; max-width: 540px; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(139,92,246,0.15); max-height: 90vh; overflow-y: auto; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: rgba(255,255,255,0.6); font-size: 18px; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .modal-close:hover { background: rgba(255,255,255,0.12); color: white; }
    .modal-field { margin-bottom: 1.1rem; }
    .modal-label { display: block; color: rgba(255,255,255,0.6); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
    .modal-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 11px 14px; color: white; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
    .modal-input:focus { border-color: rgba(139,92,246,0.5); }
    .modal-input::placeholder { color: rgba(255,255,255,0.25); }
    .modal-textarea { resize: vertical; min-height: 110px; }
    .modal-submit { width: 100%; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; border-radius: 100px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s, transform 0.15s; margin-top: 0.5rem; }
    .modal-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .modal-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .star-btn { background: none; border: none; cursor: pointer; font-size: 28px; padding: 0 3px; transition: transform 0.1s; line-height: 1; }
    .star-btn:hover { transform: scale(1.2); }

    /* ═══════════════════════════════════════════════════════
       MOBILE RESPONSIVE — all breakpoints
    ═══════════════════════════════════════════════════════ */

    /* Touch target minimum */
    button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }

    @media (max-width: 640px) {
      /* ── Hero ── */
      #hero { min-height: 100svh; min-height: 100vh; }
      .hero-title-3d { font-size: clamp(36px, 10vw, 52px) !important; margin-bottom: 14px; }
      .hero-sub-3d { font-size: 15px !important; margin-bottom: 28px !important; }
      .hero-ctas-3d { flex-direction: column; align-items: center; gap: 10px !important; }
      .hero-btn-outline-3d, .hero-btn-filled-3d {
        width: 100%; max-width: 300px;
        text-align: center; padding: 14px 24px !important;
      }
      .hero-badge-3d { margin-bottom: 22px; }
      .hero-content-3d { margin-top: 0 !important; }

      /* ── Ticker ── */
      .ticker-item-3d { font-size: 12px; padding: 0 18px; }

      /* ── Modals ── */
      .modal-backdrop { padding: 0.5rem; align-items: flex-end; }
      .modal-box {
        padding: 1.4rem 1.2rem 1.6rem !important;
        border-radius: 20px 20px 0 0 !important;
        max-height: 92vh;
        width: 100% !important;
        max-width: 100% !important;
      }
      .modal-submit { padding: 15px !important; font-size: 16px !important; }
      .modal-input { font-size: 16px !important; } /* prevents iOS zoom */
    }

    @media (max-width: 480px) {
      /* ── Section headings ── */
      h2 { word-break: break-word; }

      /* ── Features cards ── */
      .feature-card { padding: 1.4rem !important; }

      /* ── Quiz ── */
      .quiz-option { padding: 1rem 1.2rem !important; }

      /* ── Pricing tabs ── */
      .pricing-tabs { flex-direction: row; gap: 6px !important; }
      .pricing-tab { font-size: 13px !important; padding: 8px 14px !important; }

      /* ── Contact cards ── */
      .contact-card { padding: 1rem 1.2rem !important; }
    }

    /* ── Footer always stacks on mobile ── */
    @media (max-width: 640px) {
      .footer-grid { grid-template-columns: 1fr !important; gap: 2rem !important; }
    }

    /* ── Pricing carousel stage on mobile ── */
    @media (max-width: 700px) {
      .pricing-stage { height: clamp(480px, 85vw, 540px) !important; }
    }
    @media (max-width: 480px) {
      .pricing-stage { height: 460px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ══════════════════════════════════════════════════════════════════════════
    // SITE CONFIG — update this ONE line before publishing
    // All contact forms, quote requests, and client reviews email here.
    const CONTACT_EMAIL = "ontheglobemarketing@gmail.com";
    // ══════════════════════════════════════════════════════════════════════════

    // ── DESIGN TOKENS ──────────────────────────────────────────────────────────
    const T = {
      bg:        "#07070f",
      bgCard:    "rgba(255,255,255,0.03)",
      bgCardHov: "rgba(255,255,255,0.06)",
      border:    "rgba(255,255,255,0.07)",
      accent1:   "#6366f1",
      accent2:   "#8b5cf6",
      accent3:   "#06b6d4",
      textSec:   "rgba(255,255,255,0.55)",
      textMuted: "rgba(255,255,255,0.3)",
      grad:      "linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%)",
      radius:    "16px",
      radiusSm:  "10px",
      font:      "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
    };

    // ── HOOKS ──────────────────────────────────────────────────────────────────
    const useInView = (threshold = 0.12) => {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const obs = new IntersectionObserver(
          ([e]) => { if (e.isIntersecting) setInView(true); },
          { threshold }
        );
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);
      return [ref, inView];
    };

    const useScrollY = () => {
      const [y, setY] = useState(0);
      useEffect(() => {
        const h = () => setY(window.scrollY);
        window.addEventListener("scroll", h, { passive: true });
        return () => window.removeEventListener("scroll", h);
      }, []);
      return y;
    };

    const useWindowWidth = () => {
      const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
      useEffect(() => {
        const h = () => setW(window.innerWidth);
        window.addEventListener("resize", h, { passive: true });
        return () => window.removeEventListener("resize", h);
      }, []);
      return w;
    };

    // ── ANIMATED WRAPPER ───────────────────────────────────────────────────────
    const Reveal = ({ children, delay = 0, y = 36, style = {} }) => {
      const [ref, inView] = useInView();
      return (
        <div ref={ref} style={{
          opacity:   inView ? 1 : 0,
          transform: inView ? "translateY(0px)" : `translateY(${y}px)`,
          transition:`opacity 0.75s cubic-bezier(.22,1,.36,1) ${delay}s,
                     transform 0.75s cubic-bezier(.22,1,.36,1) ${delay}s`,
          ...style,
        }}>
          {children}
        </div>
      );
    };

    // ── BADGE ──────────────────────────────────────────────────────────────────
    const Badge = ({ children }) => (
      <span style={{
        display: "inline-flex", alignItems: "center", gap: 6,
        padding: "6px 14px", borderRadius: "100px",
        border: "1px solid rgba(139,92,246,0.35)",
        background: "rgba(99,102,241,0.1)",
        color: "#a5b4fc", fontSize: 12, fontWeight: 600,
        letterSpacing: "0.06em", textTransform: "uppercase",
      }}>
        <span style={{ width: 6, height: 6, borderRadius: "50%", background: T.accent2, display: "inline-block" }} />
        {children}
      </span>
    );

    // ── BUTTONS ────────────────────────────────────────────────────────────────
    const BtnPrimary = ({ children, size = "md", onClick }) => {
      const [hov, setHov] = useState(false);
      return (
        <button onClick={onClick}
          onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{
            background:    hov ? "linear-gradient(135deg,#818cf8,#a78bfa)" : T.grad,
            color: "white", border: "none",
            padding: size === "lg" ? "15px 34px" : "11px 24px",
            borderRadius: T.radiusSm,
            fontSize: size === "lg" ? 16 : 14, fontWeight: 700,
            cursor: "pointer", letterSpacing: "-0.2px",
            boxShadow: hov ? "0 8px 32px rgba(99,102,241,0.5)" : "0 4px 20px rgba(99,102,241,0.35)",
            transition: "all 0.25s ease",
            transform: hov ? "translateY(-1px)" : "none",
            whiteSpace: "nowrap",
          }}>{children}</button>
      );
    };

    const BtnGhost = ({ children, size = "md", onClick }) => {
      const [hov, setHov] = useState(false);
      return (
        <button onClick={onClick}
          onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{
            background: hov ? "rgba(255,255,255,0.08)" : "transparent",
            color: hov ? "white" : "rgba(255,255,255,0.75)",
            border: `1px solid ${hov ? "rgba(255,255,255,0.25)" : T.border}`,
            padding: size === "lg" ? "14px 32px" : "10px 22px",
            borderRadius: T.radiusSm,
            fontSize: size === "lg" ? 16 : 14, fontWeight: 600,
            cursor: "pointer", transition: "all 0.25s ease", whiteSpace: "nowrap",
          }}>{children}</button>
      );
    };

    // ── NAVBAR ─────────────────────────────────────────────────────────────────
    const NavLink = ({ href, children }) => {
      const [hov, setHov] = useState(false);
      return (
        <a href={href}
          onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
          style={{
            color: hov ? "white" : "rgba(255,255,255,0.75)",
            textDecoration: "none", fontSize: 14, fontWeight: 500,
            transition: "color 0.2s", letterSpacing: "0.01em",
          }}>{children}</a>
      );
    };

    const tickerServices = ['Content Creation','Social Media Management','Video Production','Paid Media & Ads','Analytics & Reporting','Campaign Management','Influencer Strategy','Brand Strategy','SEO & Growth','Email Marketing'];

    const Hero = ({ onBookCall }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || typeof THREE === 'undefined') return;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x07071a, 0.045);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 80);
        camera.position.set(0, 0, 14);

        scene.add(new THREE.AmbientLight(0x6644aa, 0.6));
        const light1 = new THREE.PointLight(0x7c3aed, 4, 30);
        light1.position.set(-6, 6, 6);
        scene.add(light1);
        const light2 = new THREE.PointLight(0xa855f7, 3, 25);
        light2.position.set(8, -4, 4);
        scene.add(light2);
        const light3 = new THREE.PointLight(0x3b82f6, 2.5, 20);
        light3.position.set(0, 8, -2);
        scene.add(light3);
        const rimLight = new THREE.DirectionalLight(0x4c1d95, 1.2);
        rimLight.position.set(0, -10, -8);
        scene.add(rimLight);

        const makeMat = (hue, lightness) => {
          const color = new THREE.Color().setHSL(hue, 0.65, lightness);
          return new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.8 });
        };
        const mats = [makeMat(0.72,0.12),makeMat(0.75,0.10),makeMat(0.68,0.14),makeMat(0.80,0.11),makeMat(0.65,0.09)];

        const objects = [];
        const addTorus = (x,y,z,r,tube,mi,rx,ry,rz) => {
          const mesh = new THREE.Mesh(new THREE.TorusGeometry(r,tube,32,80), mats[mi%mats.length]);
          mesh.position.set(x,y,z); mesh.rotation.set(rx,ry,rz);
          mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
          objects.push({mesh, basePos:new THREE.Vector3(x,y,z), speed:0.3+Math.random()*0.5, phase:Math.random()*Math.PI*2, spinX:(Math.random()-.5)*.003, spinY:(Math.random()-.5)*.004, floatAmp:0.3+Math.random()*0.4});
        };
        const addCylinder = (x,y,z,r,h,mi,rx,ry,rz) => {
          const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24), mats[mi%mats.length]);
          mesh.position.set(x,y,z); mesh.rotation.set(rx,ry,rz);
          mesh.castShadow = true; mesh.receiveShadow = true; scene.add(mesh);
          objects.push({mesh, basePos:new THREE.Vector3(x,y,z), speed:0.2+Math.random()*0.4, phase:Math.random()*Math.PI*2, spinX:(Math.random()-.5)*.002, spinY:(Math.random()-.5)*.003, floatAmp:0.25+Math.random()*0.35});
        };
        const addCapsule = (x,y,z,r,h,mi,rx,ry,rz) => {
          const group = new THREE.Group();
          const mat = mats[mi%mats.length];
          const body = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24), mat);
          const capT = new THREE.Mesh(new THREE.SphereGeometry(r,24,12), mat);
          const capB = new THREE.Mesh(new THREE.SphereGeometry(r,24,12), mat);
          capT.position.y = h/2; capB.position.y = -h/2;
          group.add(body,capT,capB);
          group.position.set(x,y,z); group.rotation.set(rx,ry,rz); scene.add(group);
          objects.push({mesh:group, basePos:new THREE.Vector3(x,y,z), speed:0.25+Math.random()*0.45, phase:Math.random()*Math.PI*2, spinX:(Math.random()-.5)*.003, spinY:(Math.random()-.5)*.002, floatAmp:0.2+Math.random()*0.4});
        };

        addTorus(-7,2,-2,2.4,0.55,0,0.3,0.2,0.1);
        addTorus(7,-1,-3,2.0,0.45,2,-0.2,0.4,-0.1);
        addTorus(-4,-4,-1,1.6,0.38,1,0.8,-0.3,0.5);
        addTorus(5,4,-4,2.8,0.60,3,0.1,0.6,0.2);
        addTorus(0,-6,-3,1.8,0.42,4,1.2,0.1,-0.3);
        addTorus(-9,-3,-5,2.2,0.50,0,-0.4,0.8,0.6);
        addTorus(9,5,-6,1.5,0.35,2,0.6,-0.2,0.4);

        const pmrem = new THREE.PMREMGenerator(renderer);
        const envS = new THREE.Scene(); envS.background = new THREE.Color(0x120820);
        scene.environment = pmrem.fromScene(envS).texture;

        let mouse = {x:0,y:0}, targetMouse = {x:0,y:0};
        const onMove = e => {
          targetMouse.x = (e.clientX/window.innerWidth - 0.5)*2;
          targetMouse.y = -(e.clientY/window.innerHeight - 0.5)*2;
        };
        document.addEventListener('mousemove', onMove);

        const clock = new THREE.Clock();
        let rafId;
        const animate = () => {
          rafId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();
          mouse.x += (targetMouse.x - mouse.x)*0.04;
          mouse.y += (targetMouse.y - mouse.y)*0.04;
          camera.position.x += (mouse.x*1.2 - camera.position.x)*0.02;
          camera.position.y += (mouse.y*0.8 - camera.position.y)*0.02;
          camera.lookAt(0,0,0);
          objects.forEach(obj => {
            const {mesh,basePos,speed,phase,spinX,spinY,floatAmp} = obj;
            mesh.position.x = basePos.x + Math.sin(t*speed*0.7+phase)*floatAmp*0.5;
            mesh.position.y = basePos.y + Math.sin(t*speed+phase)*floatAmp;
            mesh.position.z = basePos.z + Math.cos(t*speed*0.6+phase)*floatAmp*0.3;
            mesh.rotation.x += spinX; mesh.rotation.y += spinY;
            const p = 1.0/(1+Math.abs(basePos.z)*0.1);
            mesh.position.x += mouse.x*p*0.8;
            mesh.position.y += mouse.y*p*0.5;
          });

          light2.position.y = -4+Math.sin(t*0.35)*2;
          renderer.render(scene, camera);
        };
        animate();

        const onResize = () => {
          camera.aspect = window.innerWidth/window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onResize);

        return () => {

    // ── CONTACT / QUOTE MODAL ────────────────────────────────────────────────
    const CONTACT_METHODS = [

    ];

    const ContactModal = ({ planName, onClose }) => {
      const [method, setMethod] = useState(null);
      const [form,   setForm]   = useState({ name: "", contact: "", note: "" });
      const [status, setStatus] = useState("idle");

      const setF = (k, v) => setForm(f => ({...f, [k]: v}));
      const selected = CONTACT_METHODS.find(m => m.key === method);

      const submit = async (e) => {
        e.preventDefault();
        if (!form.name.trim() || !form.contact.trim()) return;
        setStatus("sending");
        try {
          const res = await fetch(`https://formsubmit.co/ajax/${CONTACT_EMAIL}`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              _subject: `🚀 New Quote Request — ${planName}`,
              _template: "table",
              plan_interested_in: planName,
              name: form.name,
              preferred_contact_method: selected.label,
              contact_detail: form.contact,
              additional_notes: form.note || "(none)",

          });
          const data = await res.json();
          if (res.ok && data.success !== "false") setStatus("success");
          else setStatus("error");

      };

      return (
        <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

                  <div style={{ display:"inline-flex", alignItems:"center", gap:8, marginBottom:6, padding:"3px 12px 3px 5px", borderRadius:"100px", background:"rgba(139,92,246,0.1)", border:"1px solid rgba(139,92,246,0.25)" }}>

                <div style={{ display:"flex", gap:8, marginBottom:"1.4rem", flexWrap:"wrap" }}>
                  {CONTACT_METHODS.map(m => (
                    <button key={m.key} type="button"
                      onClick={() => setMethod(m.key)}
                      style={{
                        flex:"1 1 auto", padding:"12px 8px", borderRadius:12,
                        background: method === m.key ? "rgba(139,92,246,0.18)" : "rgba(255,255,255,0.04)",

                        cursor:"pointer", transition:"all 0.2s",
                        display:"flex", flexDirection:"column", alignItems:"center", gap:6,
                        fontFamily:"inherit",
                      }}>
                      <span style={{ fontSize:22 }}>{m.icon}</span>
                      <span style={{ fontSize:12, fontWeight:600 }}>{m.label}</span>
                    </button>
                  ))}
                </div>

                {method && (
                  <>
                    <div className="modal-field">
                      <label className="modal-label">Your Name *</label>
                      <input className="modal-input" required placeholder="e.g. Jordan Rivera" value={form.name} onChange={e => setF("name", e.target.value)} />
                    </div>
                    <div className="modal-field">
                      <label className="modal-label">{selected.inputLabel} *</label>

                    <button className="modal-submit" type="submit" disabled={status === "sending"}>
                      {status === "sending" ? "Sending…" : `Request a ${selected.label} →`}
                    </button>
                    <p style={{ color:T.textMuted, fontSize:11, textAlign:"center", marginTop:"0.75rem" }}>We'll respond within 24 hours. No pressure, no commitment.</p>
                  </>

                {!method && (
                  <p style={{ color:T.textMuted, fontSize:12, textAlign:"center", padding:"0.5rem 0" }}>Select how you'd like us to reach out above.</p>
                )}
              </form>
            )}
          </div>
        </div>
      );
    };

    // ── PRICING CAROUSEL — spring-physics merry-go-round ─────────────────────
    const PricingCarousel = ({ plans, defaultActive = 1 }) => {
      const [quoteModal, setQuoteModal] = useState(null); // plan name or null
      const winW = useWindowWidth();

      const N    = plans.length;
      const STEP = 360 / N;   // degrees per card
      const isMobile = winW < 700;
      const isSmall  = winW < 480;
      const RX   = isSmall ? 175 : isMobile ? 225 : 355;  // shrink ellipse on mobile
      const RZ   = isSmall ?  65 : isMobile ?  88 : 155;

      // ── Physics refs (mutated every RAF frame — no re-renders) ────────────
      const targetRef = useRef(-defaultActive * STEP); // where the wheel wants to be
      const curRef    = useRef(-defaultActive * STEP); // current animated angle
      const velRef    = useRef(0);                     // angular velocity (deg/frame)
      const rafRef    = useRef(null);

      // ── Drag refs ─────────────────────────────────────────────────────────
      const grabXRef    = useRef(null);  // clientX at pointer-down
      const grabAngle   = useRef(0);     // curRef value at pointer-down
      const prevXRef    = useRef(null);  // last clientX (for velocity)
      const dragVelRef  = useRef(0);     // smoothed pixel velocity (EMA)

      // ── Render state ──────────────────────────────────────────────────────
      const [dispAngle, setDispAngle] = useState(-defaultActive * STEP);
      const [grabbing,  setGrabbing]  = useState(false);
      const [didDrag,   setDidDrag]   = useState(false);

      // Active card derived from TARGET (shows destination while animating)
      const active = ((Math.round(-targetRef.current / STEP) % N) + N) % N;

      // ── Motion loop ───────────────────────────────────────────────────────
      // Formula: velocity decays (momentum) + lerp pull (never overshoots).
      // This gives an ease-OUT feel: fast start → smooth deceleration → clean settle.
      const DECAY = 0.78;   // how fast velocity bleeds off each frame
      const LERP  = 0.19;   // how strongly each frame pulls toward target

      const startSpring = () => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        const tick = () => {
          velRef.current *= DECAY;
          const diff = targetRef.current - curRef.current;
          curRef.current += velRef.current + diff * LERP;
          setDispAngle(curRef.current);
          if (Math.abs(diff) > 0.05 || Math.abs(velRef.current) > 0.05) {
            rafRef.current = requestAnimationFrame(tick);
          } else {
            curRef.current = targetRef.current;
            setDispAngle(targetRef.current);
            rafRef.current = null;
          }
        };
        rafRef.current = requestAnimationFrame(tick);
      };

      useEffect(() => () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); }, []);

      // Snap to nearest card, seeded with drag momentum.
      // Longer projection (×10) means a moderate flick reliably advances one card.
      const snapNearest = (seedVel = 0) => {
        const projected   = curRef.current + seedVel * 10;
        const steps       = Math.round(-projected / STEP);
        targetRef.current = -steps * STEP;
        velRef.current    = seedVel;
        startSpring();
      };

      const go = (dir) => {
        const steps = Math.round(-targetRef.current / STEP);
        targetRef.current = -(steps + dir) * STEP;
        // Seed with a push in the direction of travel so the card sweeps away
        // immediately instead of slowly accelerating from rest
        velRef.current = -dir * 6;
        startSpring();
      };

      const goTo = (i) => {
        let diff = ((i - active) % N + N) % N;
        if (diff > N / 2) diff -= N;
        targetRef.current = targetRef.current - diff * STEP;
        // Kick in the right direction so clicking a side card sweeps it forward
        velRef.current = diff > 0 ? -4 : 4;
        startSpring();
      };

      // ── Pointer helpers ───────────────────────────────────────────────────
      const getX = (e) => {
        if (e.changedTouches?.length) return e.changedTouches[0].clientX;
        if (e.touches?.length)        return e.touches[0].clientX;
        return e.clientX;
      };

      const onDown = (e) => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current); // freeze animation
        const x = getX(e);
        grabXRef.current   = x;
        prevXRef.current   = x;
        grabAngle.current  = curRef.current;
        dragVelRef.current = 0;
        velRef.current     = 0;
        targetRef.current  = curRef.current; // keep target in sync while grabbed
        setGrabbing(true);
        setDidDrag(false);
      };

      const onMove = (e) => {
        if (grabXRef.current === null) return;
        const x  = getX(e);
        const dx = x - grabXRef.current;
        if (Math.abs(dx) > 8) setDidDrag(true);

        // Smoothed pixel velocity (EMA)
        dragVelRef.current = dragVelRef.current * 0.6 + (x - prevXRef.current) * 0.4;
        prevXRef.current   = x;

        // Directly drive angle — 280 px = one card step
        const newAngle        = grabAngle.current + (dx * STEP / 280);
        curRef.current        = newAngle;
        targetRef.current     = newAngle;
        setDispAngle(newAngle);
      };

      const onUp = (e) => {
        if (grabXRef.current === null) return;
        grabXRef.current = null;
        setGrabbing(false);
        // Convert pixel velocity → angular velocity, then let spring settle
        const degVel = dragVelRef.current * STEP / 280;
        snapNearest(degVel);
        setTimeout(() => setDidDrag(false), 80);
      };

      const onLeave = () => {
        if (grabXRef.current !== null) {
          grabXRef.current = null;
          setGrabbing(false);
          snapNearest(dragVelRef.current * STEP / 280);
          setTimeout(() => setDidDrag(false), 80);
        }
      };

      const ArrowBtn = ({ dir }) => {
        const [hov, setHov] = useState(false);
        return (
          <button onClick={() => go(dir)}
            onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
            style={{
              background:   hov ? "rgba(99,102,241,0.18)" : "rgba(255,255,255,0.06)",
              border:       `1px solid ${hov ? "rgba(99,102,241,0.5)" : "rgba(255,255,255,0.12)"}`,
              borderRadius: "50%", width: 44, height: 44,
              display:      "flex", alignItems: "center", justifyContent: "center",
              color: "white", cursor: "pointer", fontSize: 18,
              transition: "all 0.25s", flexShrink: 0,
            }}>{dir === -1 ? "←" : "→"}</button>
        );
      };

      // Cards sorted back → front (painter's algorithm)
      const cards = Array.from({ length: N }, (_, i) => {
        const theta  = ((i * STEP + dispAngle) * Math.PI) / 180;
        const x      = RX * Math.sin(theta);
        const z      = RZ * Math.cos(theta);
        const norm   = (z / RZ + 1) / 2;           // 0 = back, 1 = front
        const scale  = 0.60 + 0.40 * norm;
        const op     = 0.18 + 0.82 * norm;
        const tiltY  = -(Math.sin(theta) * 16);     // gentle inward lean
        return { i, x, z, scale, op, tiltY };
      }).sort((a, b) => a.z - b.z);

      return (
        <>
        <div>
          {/* ── 3D Stage ── */}
          <div
            onMouseDown={onDown}    onMouseMove={onMove}
            onMouseUp={onUp}        onMouseLeave={onLeave}
            onTouchStart={onDown}   onTouchMove={onMove}   onTouchEnd={onUp}
            className="pricing-stage"
            style={{
              position:    "relative",
              height:      "clamp(540px, 72vh, 680px)",
              perspective: "900px",
              overflow:    "hidden",
              cursor:      grabbing ? "grabbing" : "grab",
              userSelect:  "none",
            }}>

            <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
              {cards.map(({ i, x, z, scale, op, tiltY }) => {
                const isActive = i === active;
                return (
                  <div key={i}
                    onClick={() => { if (!didDrag && !isActive) goTo(i); }}
                    style={{
                      position:  "absolute",
                      width:     isSmall ? "clamp(200px, 72vw, 260px)" : isMobile ? "clamp(230px, 52vw, 280px)" : "clamp(262px, 24vw, 312px)",
                      // No CSS transition — RAF spring handles all motion
                      transform: `translateX(${x}px) translateZ(${z}px) scale(${scale}) rotateY(${tiltY}deg)`,
                      opacity:   op,
                      cursor:    isActive ? "default" : "pointer",
                    }}>
                    <PricingCard
                      {...plans[i]}
                      featured={isActive && plans[i].featured}
                      onGetStarted={() => setQuoteModal(plans[i].name)}
                    />
                  </div>
                );
              })}
            </div>

            {/* Side vignettes */}
            <div style={{ position:"absolute", left:0, top:0, bottom:0, width:"10%", background:"linear-gradient(to right, rgba(7,7,15,0.93), transparent)", pointerEvents:"none", zIndex:20 }} />
            <div style={{ position:"absolute", right:0, top:0, bottom:0, width:"10%", background:"linear-gradient(to left, rgba(7,7,15,0.93), transparent)", pointerEvents:"none", zIndex:20 }} />
          </div>

          {/* ── Controls ── */}
          <div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:"1.2rem", marginTop:"1.6rem" }}>
            <ArrowBtn dir={-1} />
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              {plans.map((_, i) => (
                <button key={i} onClick={() => goTo(i)}
                  style={{
                    width:      i === active ? 24 : 8,
                    height:     8, borderRadius: 4, padding: 0,
                    background: i === active ? "linear-gradient(135deg,#6366f1,#8b5cf6)" : "rgba(255,255,255,0.2)",
                    border:     "none", cursor: "pointer",
                    transition: "all 0.35s cubic-bezier(.22,1,.36,1)",
                    boxShadow:  i === active ? "0 0 10px rgba(99,102,241,0.7)" : "none",
                  }} />
              ))}
            </div>
            <ArrowBtn dir={1} />
          </div>

          {/* Plan indicator */}
          <div style={{ textAlign:"center", marginTop:"0.85rem", fontSize:13 }}>
            <span style={{ color:T.textMuted }}>{active + 1} / {N} — </span>
            <span style={{ color:"white", fontWeight:600 }}>{plans[active].name}</span>
          </div>
        </div>

        {/* Quote request modal */}
        {quoteModal && (
          <ContactModal planName={quoteModal} onClose={() => setQuoteModal(null)} />
        )}
      </>
      );
    };

                  No contracts. No hidden fees. Cancel monthly plans anytime. Website builds include a 30-day post-launch support window.
                </p>

    // ── FINAL CTA ──────────────────────────────────────────────────────────────
    const FinalCTA = () => {
      const [email, setEmail]   = useState("");
      const [status, setStatus] = useState("idle"); // idle | sending | success | error

      const submit = async (e) => {
        e.preventDefault();
        if (!email) return;

        try {

              _subject: "💼 New Consultation Request — On the Globe Marketing",
              _template: "table",

              source: "Homepage CTA",
            }),
          });
          const data = await res.json();

          else setStatus("error");
        } catch { setStatus("error"); }
      };

      return (
        <section style={{ padding: "clamp(5rem,10vw,9rem) clamp(1rem,5vw,3rem)", position: "relative", overflow: "hidden", background: T.bg }}>
          <div style={{ position: "absolute", top: 0, left: "50%", transform: "translateX(-50%)", width: 600, height: 1, background: "linear-gradient(90deg,transparent,rgba(139,92,246,0.5),transparent)" }} />
          <div style={{ position: "absolute", top: "30%", left: "50%", transform: "translate(-50%,-50%)", width: "80vw", maxWidth: 900, height: 400, background: "radial-gradient(ellipse,rgba(99,102,241,0.14) 0%,transparent 70%)", filter: "blur(60px)", pointerEvents: "none" }} />
          <div style={{ maxWidth: 760, margin: "0 auto", textAlign: "center", position: "relative" }}>
            <Reveal>
              <Badge>Let's Create Together</Badge>
              <h2 style={{ marginTop: "1.5rem", fontFamily:"'Syne',sans-serif", fontWeight:800,
                fontSize: "clamp(2.2rem,6vw,4rem)", letterSpacing: "-0.03em", color: "white", lineHeight: 1.08 }}>
                Your brand's best chapter<br />
                <span style={{ background: T.grad, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip:"text" }}>starts right now.</span>
              </h2>
              <p style={{ color: T.textSec, fontSize: "clamp(1rem,2.5vw,1.15rem)", lineHeight: 1.75, maxWidth: 520, margin: "1.5rem auto 2.5rem" }}>
                We're a new agency with big ambitions, and we'd love for your brand to be one of our founding stories. Drop your email and let's talk about what we can build together.
              </p>
              {status === "success" ? (
                <div style={{ display: "inline-flex", alignItems: "center", gap: 10, padding: "16px 28px", borderRadius: T.radius, background: "rgba(34,197,94,0.12)", border: "1px solid rgba(34,197,94,0.3)", color: "#4ade80", fontSize: 16, fontWeight: 600 }}>
                  ✓ You're in! We'll be in touch within 24 hours.
                </div>
              ) : (
                <form onSubmit={submit}
                  style={{ display: "flex", gap: "0.75rem", maxWidth: 480, margin: "0 auto", flexWrap: "wrap", justifyContent: "center" }}>
                  <input type="email" placeholder="Enter your email" value={email} onChange={e => setEmail(e.target.value)} required
                    style={{ flex: "1 1 220px", minWidth: 0, padding: "14px 18px", borderRadius: T.radiusSm, border: `1px solid ${status === "error" ? "rgba(239,68,68,0.5)" : T.border}`, background: "rgba(255,255,255,0.04)", color: "white", fontSize: 15, outline: "none", transition: "border-color 0.2s", fontFamily: T.font }}
                    onFocus={e => e.target.style.borderColor = "rgba(139,92,246,0.5)"}
                    onBlur={e => e.target.style.borderColor = T.border}
                  />
                  <BtnPrimary size="lg">{status === "sending" ? "Sending…" : "Start Free Consultation"}</BtnPrimary>
                </form>
              )}
              {status === "error" && (
                <p style={{ marginTop: "0.75rem", color: "#fca5a5", fontSize: 13 }}>Submission failed — please try again or email ontheglobemarketing@gmail.com directly.</p>
              )}
              <p style={{ marginTop: "1.2rem", color: T.textMuted, fontSize: 12 }}>
                No commitment required · Free 30-min strategy call · Response within 24 hours
              </p>
            </Reveal>
          </div>
        </section>
      );
    };

    // ── CONTACT ────────────────────────────────────────────────────────────────
    const Contact = () => {
      const [form, setForm]     = useState({ name:"", email:"", message:"" });
      const [status, setStatus] = useState("idle");
      const setF = (k,v) => setForm(f => ({...f,[k]:v}));

      const submit = async (e) => {
        e.preventDefault();
        setStatus("sending");
        try {
          const res = await fetch(`https://formsubmit.co/ajax/${CONTACT_EMAIL}`, {
            method:"POST",
            headers:{"Content-Type":"application/json",Accept:"application/json"},
            body: JSON.stringify({
              _subject:  `✉️ New Contact Message — ${form.name}`,
              _template: "table",
              _replyto:  form.email,
              name:    form.name,
              email:   form.email,
              message: form.message,
            }),
          });
          const data = await res.json();
          if (res.ok && data.success !== "false") { setStatus("success"); setForm({name:"",email:"",message:""}); }
          else setStatus("error");
        } catch { setStatus("error"); }
      };

      const infoCards = [
        { label:"Email",    value:"ontheglobemarketing@gmail.com", sub:"We respond within 24 hours",     action:"mailto:ontheglobemarketing@gmail.com" },
        { label:"Instagram", value:"@ontheglobemarketing",          sub:"DM us anytime",                  action:"https://instagram.com/ontheglobemarketing" },
        { label:"Location", value:"United States",                 sub:"Serving clients everywhere",     action: null },
      ];

      return (
        <section id="contact" style={{
          padding:"clamp(5rem,10vw,9rem) clamp(1.2rem,6vw,4rem)",
          background:"linear-gradient(180deg,#07070f 0%,#0b0b1c 60%,#07070f 100%)",
          position:"relative", overflow:"hidden",
        }}>
          {/* glow */}
          <div style={{ position:"absolute", top:"30%", left:"50%", transform:"translate(-50%,-50%)",
            width:"70vw", maxWidth:800, height:400,
            background:"radial-gradient(ellipse,rgba(99,102,241,0.12) 0%,transparent 70%)",
            filter:"blur(60px)", pointerEvents:"none" }} />

          <div style={{ maxWidth:1100, margin:"0 auto" }}>
            {/* Label */}
            <Reveal>
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:18 }}>
                <div style={{ width:32, height:2, background:"linear-gradient(90deg,#6366f1,#8b5cf6)", borderRadius:2 }} />
                <span style={{ fontSize:11, fontWeight:700, letterSpacing:"0.18em", textTransform:"uppercase",
                  color:"rgba(139,92,246,0.85)" }}>Contact</span>
              </div>
            </Reveal>
            <Reveal delay={0.06}>
              <h2 style={{ fontFamily:"'Syne',sans-serif", fontWeight:800,
                fontSize:"clamp(2rem,5vw,3.4rem)", lineHeight:1.1, letterSpacing:"-0.03em",
                color:"white", maxWidth:600, marginBottom:"clamp(1rem,2.5vw,1.5rem)" }}>
                Let's build something<br />
                <span style={{ background:"linear-gradient(90deg,#818cf8,#a78bfa)",
                  WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent",
                  backgroundClip:"text" }}>great together.</span>
              </h2>
              <p style={{ fontSize:"clamp(1rem,1.5vw,1.1rem)", color:"rgba(240,239,255,0.6)",
                lineHeight:1.7, maxWidth:480, marginBottom:"clamp(2.5rem,5vw,4rem)" }}>
                Whether you have a project in mind or just want to chat about your brand, we'd love to hear from you. Reach out directly or fill in the form.
              </p>
            </Reveal>

            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(min(100%,440px),1fr))",
              gap:"clamp(2rem,5vw,4rem)", alignItems:"start" }}>

              {/* Left — info cards */}
              <Reveal delay={0.1}>
                <div style={{ display:"flex", flexDirection:"column", gap:"1rem" }}>
                  {infoCards.map(c => (
                    <div key={c.label}
                      onClick={() => c.action && window.open(c.action)}
                      style={{
                        display:"flex", alignItems:"flex-start", gap:"1rem",
                        background:"rgba(255,255,255,0.03)",
                        border:`1px solid ${c.action ? "rgba(99,102,241,0.25)" : "rgba(255,255,255,0.08)"}`,
                        borderRadius:16, padding:"1.25rem 1.4rem",
                        backdropFilter:"blur(6px)",
                        cursor: c.action ? "pointer" : "default",
                        transition:"all 0.2s",
                      }}
                      onMouseEnter={e => { if(c.action) { e.currentTarget.style.background="rgba(99,102,241,0.1)"; e.currentTarget.style.borderColor="rgba(99,102,241,0.4)"; }}}
                      onMouseLeave={e => { if(c.action) { e.currentTarget.style.background="rgba(255,255,255,0.03)"; e.currentTarget.style.borderColor="rgba(99,102,241,0.25)"; }}}
                    >
                      <div style={{ flex:1 }}>
                        <div style={{ fontSize:12, fontWeight:700, letterSpacing:"0.08em",
                          textTransform:"uppercase", color:"rgba(139,92,246,0.8)", marginBottom:4 }}>{c.label}</div>
                        <div style={{ fontSize:15, fontWeight:700, color:"white", marginBottom:3 }}>{c.value}</div>
                        <div style={{ fontSize:12, color:"rgba(240,239,255,0.45)", display:"flex", alignItems:"center", gap:6 }}>
                          {c.sub}
                          {c.action && <span style={{ fontSize:11, color:"rgba(139,92,246,0.7)", fontWeight:600 }}>Tap to message →</span>}
                        </div>
                      </div>
                    </div>
                  ))}

                  {/* Social row */}
                  <div style={{ marginTop:"0.4rem" }}>
                    <div style={{ fontSize:12, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase",
                      color:"rgba(139,92,246,0.75)", marginBottom:12 }}>Follow Along</div>
                    <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                      {[
                        { label:"Instagram", handle:"@ontheglobemarketing" },
                        { label:"TikTok",    handle:"@ontheglobe" },
                        { label:"LinkedIn",  handle:"On the Globe Marketing" },
                      ].map(s => (
                        <div key={s.label} style={{
                          background:"rgba(99,102,241,0.08)", border:"1px solid rgba(99,102,241,0.2)",
                          borderRadius:100, padding:"6px 14px",
                          fontSize:12, fontWeight:600, color:"rgba(200,200,255,0.8)",
                          cursor:"pointer",
                        }}>{s.label} · {s.handle}</div>
                      ))}
                    </div>
                  </div>
                </div>
              </Reveal>

              {/* Right — contact form */}
              <Reveal delay={0.18}>
                <div style={{
                  background:"rgba(255,255,255,0.03)",
                  border:"1px solid rgba(255,255,255,0.08)",
                  borderRadius:20, padding:"2rem",
                  backdropFilter:"blur(6px)",
                }}>
                  {status === "success" ? (
                    <div style={{ textAlign:"center", padding:"3rem 1rem" }}>
                      <div style={{ fontSize:40, marginBottom:16 }}>🎉</div>
                      <div style={{ fontSize:20, fontWeight:800, color:"white", marginBottom:8 }}>Message sent!</div>
                      <p style={{ color:"rgba(240,239,255,0.6)", lineHeight:1.65 }}>We'll be in touch within 24 hours. Talk soon.</p>
                    </div>
                  ) : (
                    <form onSubmit={submit} style={{ display:"flex", flexDirection:"column", gap:"1rem" }}>
                      <div>
                        <div>
                          <label className="modal-label">Name *</label>
                          <input className="modal-input" required placeholder="Your name"
                            value={form.name} onChange={e=>setF("name",e.target.value)} />
                        </div>

                      </div>
                      <div>
                        <label className="modal-label">Email *</label>
                        <input className="modal-input" type="email" required placeholder="your@email.com"
                          value={form.email} onChange={e=>setF("email",e.target.value)} />
                      </div>
                      <div>
                        <label className="modal-label">How can we help?</label>
                        <textarea className="modal-input modal-textarea" placeholder="Tell us about your project or what you're looking to achieve..."
                          value={form.message} onChange={e=>setF("message",e.target.value)}
                          style={{ minHeight:110 }} />
                      </div>
                      {status === "error" && (
                        <p style={{ color:"#fca5a5", fontSize:13, margin:0 }}>Something went wrong. Please try again or email us at ontheglobemarketing@gmail.com.</p>
                      )}
                      <button type="submit" className="modal-submit"
                        disabled={status==="sending"}
                        style={{ opacity: status==="sending" ? 0.7 : 1, cursor: status==="sending" ? "not-allowed" : "pointer" }}>
                        {status === "sending" ? "Sending your message…" : "Send Message →"}
                      </button>
                      <p style={{ textAlign:"center", fontSize:12, color:"rgba(240,239,255,0.35)", margin:0 }}>
                        Sends directly to ontheglobemarketing@gmail.com
                      </p>
                    </form>
                  )}
                </div>
              </Reveal>
            </div>
          </div>
        </section>
      );
    };

    // ── FOOTER ─────────────────────────────────────────────────────────────────
    const Footer = () => {
      const navCols = [
        {
          heading: "Services",
          items: [
            { label: "Brand Strategy",    href: "#services" },
            { label: "Content Creation",  href: "#services" },
            { label: "Social Media",      href: "#services" },
            { label: "Video Production",  href: "#services" },
          ],
        },
        {
          heading: "Company",
          items: [
            { label: "About Us",   href: "#about" },
            { label: "Our Work",   href: "#work" },
            { label: "Pricing",    href: "#pricing" },
            { label: "Contact",    href: "#contact" },
          ],
        },
      ];
      return (
        <footer style={{ background: "rgba(255,255,255,0.015)", borderTop: `1px solid ${T.border}`, padding: "clamp(3rem,6vw,5rem) clamp(1rem,5vw,3rem) clamp(1.5rem,3vw,2.5rem)" }}>
          <div style={{ maxWidth: 1200, margin: "0 auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: "3rem", marginBottom: "3rem" }} className="footer-grid">
              {/* Brand col */}
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: "1.2rem" }}>
                  <GlobeLogo size={36} uid="foot" />
                  <div style={{ lineHeight: 1 }}>
                    <div style={{ color: "white", fontWeight: 800, fontSize: 13, letterSpacing: "-0.3px" }}>
                      On the Globe <span style={{ background: T.grad, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Marketing</span>
                    </div>
                  </div>
                </div>
                <p style={{ color: T.textSec, fontSize: 14, lineHeight: 1.75, maxWidth: 260 }}>A creative marketing agency turning bold ideas into iconic brands, worldwide.</p>
              </div>
              {/* Nav cols */}
              {navCols.map(col => (
                <div key={col.heading}>
                  <div style={{ color: "white", fontWeight: 700, fontSize: 14, marginBottom: "1rem", letterSpacing: "-0.2px" }}>{col.heading}</div>
                  {col.items.map(item => (
                    <a key={item.label} href={item.href}
                      style={{ display: "block", color: T.textSec, textDecoration: "none", fontSize: 14, padding: "4px 0", transition: "color 0.2s" }}
                      onMouseEnter={e => e.target.style.color = "white"}
                      onMouseLeave={e => e.target.style.color = T.textSec}
                    >{item.label}</a>
                  ))}
                </div>
              ))}
            </div>
            <div style={{ borderTop: `1px solid ${T.border}`, paddingTop: "1.5rem", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "1rem" }}>
              <p style={{ color: T.textMuted, fontSize: 13 }}>© 2026 On the Globe Marketing. All rights reserved.</p>
              <p style={{ color: T.textMuted, fontSize: 13 }}>Built for brands that dare to be different.</p>
            </div>
          </div>
        </footer>
      );
    };

    // ── APP ────────────────────────────────────────────────────────────────────
    function App() {
      const [bookCallOpen, setBookCallOpen] = useState(false);
      return (
        <div style={{ fontFamily: T.font, background: T.bg, minHeight: "100vh" }}>
          <Navbar onBookCall={() => setBookCallOpen(true)} />
          <Hero onBookCall={() => setBookCallOpen(true)} />
          <Features />
          <About />
          <Testimonials />
          <Quiz />
          <Pricing />
          <FinalCTA />
          <Contact />
          <Footer />
          {bookCallOpen && <BookCallModal onClose={() => setBookCallOpen(false)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
